<div class="max-w-4xl mx-auto mt-8 border border-green-700 rounded-xl p-6 bg-white">

      <label class="font-semibold">Location</label>
      <select class="border border-gray-400 w-full px-2 py-1">
        <option>Select Location</option>
        <option>Lalmonirhat</option>
      </select>

      <label class="font-semibold">Loan Range</label>
      <select class="border border-gray-400 w-full px-2 py-1">

        <option>50000 - 100000</option>
        <option>100000 - 250000</option>
        <option>250000 - 400000</option>
        <option>400000 - 600000</option>
        <option>600000 - 800000</option>

        <option> More than 1000000</option>

      <label class="font-semibold">Sector</label>
      <select class="border border-gray-400 w-full px-2 py-1">
        <option>Select Sector</option>
        <option>Food</option>
        <option>Clothing</option>
        <option>Jewellery</option>
        
      </select>

       <label class="font-semibold">Type of Business</label>
      <select class="border border-gray-400 w-full px-2 py-1">
        <option>Select Business Type</option>
        <option>Proprietorship</option>
      </select>

<label class="font-semibold">Age of Business</label>
      <select class="border border-gray-400 w-full px-2 py-1">
        <option>Select Business Age</option>
        <option>Less than 1 year</option>
        <option>1-5 years</option>
        <option>5-10 years</option>
        <option>More than 10 years</option>
      </select>


    <div class="mt-6 text-right">
      <button class="bg-green-700 text-white px-6 py-2 rounded-lg">SUBMIT</button>
    </div>
