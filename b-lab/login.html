<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Lab Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
        }
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .role-selection {
            margin: 20px 0;
        }
        .role-selection label {
            margin-right: 10px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .info-section {
            margin-top: 30px;
        }
    </style>
</head>
<body>


<center><a href="/b-lab/index.html"><img src="b_lab_1.png"></a></center>
<div class="login-container">
    <h2>Log In</h2>
    <form>
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">User Password *</label>
            <input type="password" id="password" required>
        </div>
        <div class="role-selection">
            <label><input type="radio" name="role" value="entrepreneurs"> Entrepreneurs</label>
            <label><input type="radio" name="role" value="investors"> Investors</label>
        </div>
        <button type="submit" class="btn">Log In</button>
    </form>
</div>



</body>
</html>
